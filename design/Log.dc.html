<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LiftMax — Workouts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:ital,wght@0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E12}
a{color:#FF6A00;text-decoration:none}a:hover{color:#FF8A33}
input:focus,textarea:focus{outline:2px solid #FF6A00;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0E12; color: #F5F5F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <sc-if value="{{showList}}" hint-placeholder-val="{{true}}">
    <header style="padding: 60px 20px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px">Workouts</h1>
        <div style="font-size: 14px; color: #9AA3AE">Go-to sessions outside the 5 days</div>
      </div>
      <button onClick="{{openNew}}" aria-label="New workout" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #FF6A00; color: #0B0E12; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </header>
    <div style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{workouts}}" as="w" hint-placeholder-count="3">
        <button type="button" onClick="{{w.open}}" style="text-align: left; border-radius: 16px; background: #151A20; border: 1px solid #2B3440; padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px; color: #F5F5F5; cursor: pointer; font-family: Inter, sans-serif">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 16px; font-weight: 700">{{w.title}}</span>
            <span style="font-size: 13px; line-height: 1.45; color: #9AA3AE; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{w.notes}}</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{showEditor}}" hint-placeholder-val="{{false}}">
    <header style="padding: 52px 12px 8px; display: flex; align-items: center; justify-content: space-between">
      <button onClick="{{close}}" aria-label="Back to workouts" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F5F5F5; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 2px; color: #9AA3AE; text-transform: uppercase">Workout</div>
      <button aria-label="Delete workout" style="width: 44px; height: 44px; border: 0; background: transparent; color: #9AA3AE; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
      </button>
    </header>
    <form style="flex: 1; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9AA3AE">Title
        <input type="text" defaultValue="{{current.title}}" placeholder="e.g. Hotel gym, full body" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #2B3440; background: #151A20; color: #F5F5F5; font: 700 18px Inter, sans-serif">
      </label>
      <label style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9AA3AE">Notes
        <textarea defaultValue="{{current.notes}}" placeholder="Write it out: exercises, weights, sets, reps…" style="flex: 1; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 1px solid #2B3440; background: #151A20; color: #F5F5F5; font: 400 15px/1.6 Inter, sans-serif; resize: none"></textarea>
      </label>
      <button type="button" onClick="{{close}}" style="min-height: 52px; border-radius: 14px; border: 0; background: #FF6A00; color: #0B0E12; font: 700 16px Inter, sans-serif; cursor: pointer">Save</button>
    </form>
  </sc-if>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 12px 28px; background: #0B0E12; border-top: 1px solid #2B3440">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #9AA3AE; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Days</a>
    <a href="Extras.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #9AA3AE; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"></path></svg>Extras</a>
    <a href="Log.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #FF6A00; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Workouts</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: -1 };
  }
  renderVals() {
    var self = this;
    var list = [
      { title: 'Hotel gym — full body', notes: 'DB goblet squat 50 lb × 12, 3 sets\nPush-ups 3 × 15\nDB row 40 lb × 10, 3 sets\nPlank 3 × 45 s' },
      { title: 'Post-run core', notes: 'Plank 3 × 45 s\nDead bug 3 × 10\nPallof press 3 × 12 each side\nSide plank 2 × 30 s' },
      { title: 'Upper body pump', notes: 'Cable fly 25 lb × 12\nLateral raise 15 lb × 15\nRope pushdown 40 lb × 12\nHammer curl 25 lb × 12' }
    ];
    var open = this.state.open;
    var current = open === -2 ? { title: '', notes: '' } : (list[open] || { title: '', notes: '' });
    return {
      showList: open === -1,
      showEditor: open !== -1,
      current: current,
      openNew: function () { self.setState({ open: -2 }); },
      close: function () { self.setState({ open: -1 }); },
      workouts: list.map(function (w, i) {
        return Object.assign({}, w, { open: function () { self.setState({ open: i }); } });
      })
    };
  }
}
</script>
</body>
</html>
