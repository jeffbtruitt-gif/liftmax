<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LiftMax — Extras</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:ital,wght@0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E12}
a{color:#FF6A00;text-decoration:none}a:hover{color:#FF8A33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0E12; color: #F5F5F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 60px 20px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px">Extras</h1>
      <div style="font-size: 14px; color: #9AA3AE">Swap-ins and accessories</div>
    </div>
    <button aria-label="Add extra exercise" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #FF6A00; color: #0B0E12; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 2px; color: #9AA3AE; text-transform: uppercase">{{g.name}}</h2>
        <div style="border-radius: 16px; background: #2B3440; border: 1px solid #2B3440; overflow: hidden; display: flex; flex-direction: column; gap: 1px">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
            <div style="background: #151A20; display: flex; flex-direction: column">
              <div style="display: flex; align-items: center">
                <a href="Exercise.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 13px 4px 13px 16px; min-height: 44px; color: #F5F5F5">
                  <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600">{{it.name}}</span>
                  <span style="font-size: 14px; font-weight: 700; color: #D7D9DC; font-variant-numeric: tabular-nums; white-space: nowrap">{{it.current}}</span>
                </a>
                <button type="button" onClick="{{it.toggle}}" aria-label="Edit or delete {{it.name}}" style="width: 44px; height: 44px; margin-right: 4px; border: 0; background: transparent; color: #9AA3AE; display: flex; align-items: center; justify-content: center; cursor: pointer">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
                </button>
              </div>
              <sc-if value="{{it.menuOpen}}" hint-placeholder-val="{{false}}">
                <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px 12px">
                  <button type="button" style="min-height: 44px; border-radius: 12px; border: 1px solid #2B3440; background: #0B0E12; color: #F5F5F5; font: 600 13px Inter, sans-serif; cursor: pointer">Edit</button>
                  <button type="button" style="min-height: 44px; border-radius: 12px; border: 1px solid #2B3440; background: #0B0E12; color: #F5F5F5; font: 600 13px Inter, sans-serif; cursor: pointer">Move group</button>
                  <button type="button" style="min-height: 44px; border-radius: 12px; border: 1px solid #6B2A2A; background: #0B0E12; color: #FF8A80; font: 600 13px Inter, sans-serif; cursor: pointer">Delete</button>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 12px 28px; background: #0B0E12; border-top: 1px solid #2B3440">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #9AA3AE; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Days</a>
    <a href="Extras.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #FF6A00; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"></path></svg>Extras</a>
    <a href="Log.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #9AA3AE; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Workouts</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: '0-0' };
  }
  renderVals() {
    var self = this;
    var groups = [
      { name: 'Leg accessories', items: [
        { name: 'Hip Abductor Machine', rx: '3 × 12–15', current: '110 lb × 15' },
        { name: 'Leg Extension Machine', rx: '3 × 10–12', current: '100 lb × 12' },
        { name: 'Lying Leg Curl', rx: '3 × 10–12', current: '70 lb × 10' } ] },
      { name: 'Chest & shoulder accessories', items: [
        { name: 'Cable Chest Fly', rx: '3 × 12', current: '25 lb × 12' },
        { name: 'Dumbbell Lateral Raise', rx: '3 × 12–15', current: '15 lb × 15' } ] },
      { name: 'Back & core accessories', items: [
        { name: "Farmer's Carries", rx: '3 × 30–45 sec', current: '60 lb · 40 s' } ] }
    ];
    return {
      groups: groups.map(function (g, gi) {
        return { name: g.name, items: g.items.map(function (it, ii) {
          var key = gi + '-' + ii;
          return Object.assign({}, it, {
            menuOpen: self.state.menu === key,
            toggle: function () { self.setState({ menu: self.state.menu === key ? '' : key }); }
          });
        }) };
      })
    };
  }
}
</script>
</body>
</html>
