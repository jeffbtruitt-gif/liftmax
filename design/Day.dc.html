<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LiftMax — Day 1 Legs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:ital,wght@0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E12}
a{color:#FF6A00;text-decoration:none}a:hover{color:#FF8A33}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0E12; color: #F5F5F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Back to days" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5F5F5">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 2px; color: #9AA3AE; text-transform: uppercase">Day 1</div>
  </header>

  <div style="padding: 0 20px 14px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px">Legs</h1>
    <div style="font-size: 14px; color: #9AA3AE">Quads, hamstrings, glutes, calves</div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{exercises}}" as="ex" hint-placeholder-count="5">
      <sc-if value="{{ex.isFocus}}" hint-placeholder-val="{{false}}">
        <div style="border-radius: 18px; background: #1A1410; border: 2px solid #FF6A00; padding: 14px 14px 14px 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: #FF6A00; color: #0B0E12; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle></svg>Focus</span>
            <span style="font-size: 12px; color: #D7D9DC">Heavier load today</span>
          </div>
          <a href="Exercise.dc.html" style="display: flex; align-items: center; gap: 10px; color: #F5F5F5">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <div style="font-size: 19px; font-weight: 700">{{ex.name}}</div>
            </div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          </a>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{ex.vars}}" as="v" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #0B0E12; border: 1px solid #2B3440">
                <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #D7D9DC">{{v.name}}<sc-if value="{{v.isMain}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 7px; border-radius: 999px; border: 1px solid #FF6A00; color: #FF6A00; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase">Main</span></sc-if></span>
                <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{v.load}}</span>
              </div>
            </sc-for>
          </div>
          <div style="font-size: 13px; line-height: 1.45; color: #FFB27A; display: flex; gap: 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
            <span>{{ex.focusNote}}</span>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ex.notFocus}}" hint-placeholder-val="{{true}}">
        <div style="border-radius: 16px; background: #151A20; border: 1px solid #2B3440; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 8px">
          <a href="Exercise.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 8px 0; color: #F5F5F5">
            <span style="font-size: 16px; font-weight: 600">{{ex.name}}</span>
            <span style="display: flex; align-items: baseline; gap: 8px; margin-top: 4px">
              <span style="font-size: 17px; font-weight: 700; color: #F5F5F5; font-variant-numeric: tabular-nums">{{ex.mainLoad}}</span>
              <span style="font-size: 13px; color: #D7D9DC">{{ex.mainName}}</span>
            </span>
          </a>
          <button onClick="{{ex.makeFocus}}" aria-label="Make {{ex.name}} the focus" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2B3440; background: #0B0E12; color: #9AA3AE; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </sc-if>
    </sc-for>
    <div style="font-size: 12px; color: #9AA3AE; text-align: center; padding-top: 6px">Tap the target on any exercise to move Focus</div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 12px 28px; background: #0B0E12; border-top: 1px solid #2B3440">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #FF6A00; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Days</a>
    <a href="Extras.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #9AA3AE; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"></path></svg>Extras</a>
    <a href="Log.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-height: 44px; color: #9AA3AE; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Workouts</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 0 };
  }
  renderVals() {
    var list = [
      { name: 'Barbell Squat', rx: '3 × 8–10 · Quads, glutes', current: 'Barbell · 185 lb × 8',
        vars: [{ name: 'Barbell', load: '185 lb × 8' }, { name: 'Smith machine', load: '155 lb × 10' }],
        focusNote: 'Barbell: 205 lb × 5, 4 sets. Smith: 175 lb × 6.' },
      { name: 'Deadlift', rx: '3 × 5–6 · Hamstrings, glutes, back', current: 'Trap bar · 225 lb × 5',
        vars: [{ name: 'Trap bar', load: '225 lb × 5' }, { name: 'Conventional', load: '205 lb × 5' }],
        focusNote: 'Trap bar: 255 lb × 3, rest 2 min.' },
      { name: 'Bulgarian Split Squat', rx: '3 × 8 per leg · Quads, glutes', current: 'Dumbbell · 35 lb × 8',
        vars: [{ name: 'Dumbbell', load: '35 lb × 8' }],
        focusNote: 'Dumbbell: 45 lb × 6 per leg.' },
      { name: 'Seated Leg Curl', rx: '3 × 10–12 · Hamstrings', current: 'Machine · 90 lb × 12',
        vars: [{ name: 'Machine', load: '90 lb × 12' }],
        focusNote: 'Machine: 105 lb × 8, slow negatives.' },
      { name: 'Standing Calf Raise', rx: '3 × 12–15 · Calves', current: 'Machine · 140 lb × 15',
        vars: [{ name: 'Machine', load: '140 lb × 15' }],
        focusNote: 'Machine: 170 lb × 10, pause at top.' }
    ];
    var self = this;
    return {
      exercises: list.map(function (ex, i) {
        return Object.assign({}, ex, {
          mainName: ex.vars[0].name,
          mainLoad: ex.vars[0].load,
          vars: ex.vars.map(function (v, j) { return Object.assign({}, v, { isMain: j === 0 }); }),
          isFocus: self.state.focus === i,
          notFocus: self.state.focus !== i,
          makeFocus: function () { self.setState({ focus: i }); }
        });
      })
    };
  }
}
</script>
</body>
</html>
